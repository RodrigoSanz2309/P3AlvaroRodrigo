<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi nombre</title>
    <link rel="stylesheet" href="./css/iroom.css">
</head>
<body>
    <header>
        <h1>Smart Room</h1>
    </header>

    <main>
        <section>
            <h2>Introduzca su nombre</h2>

            <form id="formNombre">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escriba su nombre" required>
                <button type="submit">Guardar</button>
            </form>
            <!-- Apartado 3: Verificación de correo electrónico -->
            <hr style="margin: 20px 0;">
            <h3>Verificación de correo electrónico</h3>
      
            <div class="campo-form">
          <label for="email">Correo Electrónico:</label>
          <input type="text" id="email" name="email" placeholder="ejemplo@dominio.com">
            </div>

      <div style="margin-top: 10px;">
          <button type="button" onclick="validarEmailCadenas()">Validar (Sin Regex)</button>
          <button type="button" onclick="validarEmailRegex()">Validar (Con Regex)</button>
      </div>

      <p id="resultadoEmail" style="font-weight: bold; margin-top: 10px;"></p>
            <p><a href="index.html">Volver a la página principal</a></p>
        </section>
    </main>
    <footer>Universidad de Alcalá</footer>

    <script>
        const formulario = document.getElementById("formNombre");
        const campo = document.getElementById("nombre");
        campo.value = localStorage.getItem("fname") || "";

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();
            const nombre = campo.value.trim();
            if (nombre === "")return;
            localStorage.setItem("fname", nombre);
            alert("Nombre guardado: " + nombre + ". Ahora puede volver a la página principal.");
        });
    </script>
    <script src="datos.js"></script>
</body>
</html>
