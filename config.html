<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuración - Smart Room</title>
    <link rel="stylesheet" href="./css/iroom.css">
    <script src="datos.js"></script>

</head>


<body>
    <header>
        <h1>Smart Room</h1>
    </header>
    <nav aria-label="Menú principal">
        <a href="index.html" class="menu-btn">Inicio</a>
        <a href="config.html" class="menu-btn">Configuración</a>
        <a href="minombre.html" class="menu-btn">Nombre</a>
        <a href="calculadora.html" class="menu-btn">Calculadora</a>
    </nav>
    <main class="config">
        <form action="datos.js" novalidate>
            <section>
                <h2>Datos de la habitación</h2>

                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" placeholder="Introduzca su país" autocomplete="off">




                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Selecciona una ciudad" list="lista-ciudades" autocomplete="off">
                <datalist id="lista-ciudades">
                </datalist>



                <label for="mapa">Mapa URL:</label>
                <input type="url" id="mapa" name="mapa" placeholder="Introduce la URL del mapa">           


                <label for="coordenadasGPS">Coordenadas GPS:</label>
            <input type="text" id="coordenadasGPS" name="gps" placeholder="Ej. 40.4168, -3.7038" oninput="generarEnlaceGoogleMaps()">
            <p>
                <a id="enlaceMapa" href="#" target="_blank" style="display: none; color: #0066cc;">Ver posición en Google Maps</a>
                <span id="errorGPS" style="color: red; display: none;">Formato de coordenadas no válido</span>
            </p>


                <label for="imagen">Imagen:</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">


                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
                <p id="indicador-password"></p>



            </section>



            <section>
                <h2>Selección de sensores</h2>
                <p>
                <input type="checkbox" id="temperatura" name="sensores" value="temperatura">
                <label for="temperatura">Temperatura</label>
                </p>



                <p>
                <input type="checkbox" id="humedad" name="sensores" value="Humedad">
                <label for="humedad">Humedad</label>
                </p>


                <p>
                <input type="checkbox" id="sonido" name="sensores" value="Sonido">
                <label for="sonido">Nivel de sonido</label>
                </p>

                <p>
                <input type="checkbox" id="luz" name="sensores" value="Luz">
                <label for="luz">Nivel de luz</label>
                </p>

                <p>
                <input type="checkbox" id="movimiento" name="sensores" value="Movimiento">
                <label for="movimiento">Movimiento</label>
                </p>

                <h2>Selección de alertas</h2>

                <label for="tempActual">Temperatura actual (°C):</label>
                <input type="number" id="tempActual" name="tempActual" step="0.5" placeholder="Ej. 24.0">

                <label for="tempMax">Temperatura máxima (°C):</label>
                <input type="number" id="tempMax" name="tempMax" min="-20" max="45" step="0.5" placeholder="Ej. 30.5">

                <label for="tempMin">Temperatura mínima (°C):</label>
                <input type="number" id="tempMin" name="tempMin" min="-20" max="45" step="0.5" placeholder="Ej. 10.5">

                <p>Diferencia de temperatura: <output id="diferencia" for="tempMax tempMin"></output></p>
            </section>
            <input type="submit" value="Enviar información">
        </form>
        <p class="enlace-volver">
            <a href="index.html">Volver a la página principal</a>
        </p>
    </main>
    <footer>Universidad de Alcalá</footer>

<div id="modal" class="modal">
    <div class="modal-caja">
        <p id="modal-mensaje"></p>
        <button type="button" id="modal-cerrar">Aceptar</button>
        <button type="button" id="modal-enviar" hidden>Enviar igualmente</button>
    </div>
</div>

        <script>

        const modal = document.getElementById("modal");
        const modalMensaje=document.getElementById("modal-mensaje");
        const botonCerrar = document.getElementById("modal-cerrar");

            const CIUDADES = {
                "España": ["Madrid", "Barcelona", "Valencia"],
                "Francia": ["París", "Lyon", "Marsella"],
                "Portugal": ["Lisboa", "Oporto", "Braga"]
            };

            const inputPais = document.getElementById("pais");
            const listaCiudades = document.getElementById("lista-ciudades");

            function actualizarCiudades() {
                listaCiudades.innerHTML = "";
                const ciudades = CIUDADES[inputPais.value] || [];
                ciudades.forEach(function(ciudad){
                    const opcion = document.createElement("option");
                    opcion.value = ciudad;
                    listaCiudades.appendChild(opcion);                 
                });
            }
            inputPais.addEventListener("input", actualizarCiudades);

            const inputMax = document.getElementById("tempMax");
            const inputMin = document.getElementById("tempMin");
            const salidaDiferencia = document.getElementById("diferencia");
            const TEMP_MAX = 45;
            const TEMP_MIN = -20;
            const tempActualMin = 22;
            const tempActualMax =26;
            const L_password=9;
            const indicadorPassword=document.getElementById("indicador-password");
            const inputPassword=document.getElementById("password");
            const botonEnviar =document.getElementById("modal-enviar");

            function evaluarLongitud(){
                const largo=inputPassword.value.length;
                if(largo===0){
                    indicadorPassword.textContent="";
                } else if (largo<L_password){
                    indicadorPassword.textContent="Evaluación de longitud: insuficiente.";
                }else if(largo<11){
                    indicadorPassword.textContent="Evaluación de longitud: corta.";
                } else if (largo<15){
                    indicadorPassword.textContent="Evaluación de longitud: media.";
                }else{
                    indicadorPassword.textContent="Evaluación de longitud: larga.";
                }
            }
            inputPassword.addEventListener("input", evaluarLongitud);
            function fueraDeRango(valor) {
                return valor < TEMP_MIN || valor > TEMP_MAX;
            }
            function calculoDiferencia() {
                const max = parseFloat(inputMax.value);
                const min = parseFloat(inputMin.value);
                inputMax.setCustomValidity("");
                inputMin.setCustomValidity("");
                salidaDiferencia.value = "";

                if (isNaN(max) || isNaN(min)) {
                    return;
                }
                if (fueraDeRango(max) || fueraDeRango(min)) {
                    const mensaje = "Los valores de la temperatura deben estar entre " + TEMP_MIN + " °C y " + TEMP_MAX + " °C.";
                    if (fueraDeRango(max)) inputMax.setCustomValidity(mensaje);
                    if (fueraDeRango(min)) inputMin.setCustomValidity(mensaje);
                    salidaDiferencia.value = "Error: " + mensaje;
                    return;
                }
                if (max < min) {
                    const mensaje = "La temperatura máxima no puede ser menor que la mínima.";
                    inputMax.setCustomValidity(mensaje);
                    salidaDiferencia.value = "Error: " + mensaje;
                    return;
                }
                salidaDiferencia.value = (max - min) + " °C";
            }
            inputMax.addEventListener("input", calculoDiferencia);
            inputMin.addEventListener("input", calculoDiferencia);



            const formulario = document.querySelector("form");
            formulario.addEventListener("submit", function(evento){
                const errores =[];
                const avisos = [];
                const paisIntroducido = document.getElementById("pais").value;
                const paisPermitido = Object.keys(CIUDADES).map(function(p){return p.toLowerCase();});
                if (!paisPermitido.includes(paisIntroducido.trim().toLowerCase())){
                    errores.push("País no válido. Los países admitidos son: " + Object.keys(CIUDADES).join(", "));
                }
                        const tempActual =parseFloat(document.getElementById("tempActual").value);
        if(isNaN(tempActual)){

            errores.push("La temperatura tiene un valor diferente al esperado. Introduce una temperatura numérica.");
        } else if (tempActual< tempActualMin || tempActual>tempActualMax){
            avisos.push("La temperatura esta fuera del rango esperado.");
        }
        const password = document.getElementById("password").value;
        if (password.length < L_password){
            errores.push("La contraseña debe tener al menos 9 caracteres.");
        }
        if(errores.length>0){
            evento.preventDefault();
            mostrarModal(errores.concat(avisos).join("\n"));
        } else if (avisos.length>0){
            evento.preventDefault();
            mostrarAviso(avisos.join("\n"));
        }
            });


        function mostrarModal(mensaje){
            modalMensaje.textContent =mensaje;
            botonCerrar.textContent="Aceptar";
            botonEnviar.hidden=true;
            modal.classList.add("visible");
        }
        function mostrarAviso(mensaje){
            modalMensaje.textContent=mensaje + "\n¿Quieres corregirla o enviar igualmente?";
            botonCerrar.textContent="Corregir";
            botonEnviar.hidden= false;
            modal.classList.add("visible");
        }

        function cerrarModal(){
            modal.classList.remove("visible");
        }
        botonCerrar.addEventListener("click", cerrarModal);
        botonEnviar.addEventListener("click", function(){
            cerrarModal();
            formulario.submit();
        });
        
        
        
        
        </script>
</body>
</html>
